[project]
name = "clauscheck-api"
version = "0.1.0"
description = "ClausCheck API + worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pgvector>=0.3.6,<1.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "pyjwt>=2.9,<3.0",
    "argon2-cffi>=23.1,<24.0",
    "httpx>=0.27,<1.0",
    "arq>=0.26,<1.0",
    "redis>=5.0,<6.0",
    "cryptography>=43.0,<44.0",
    "anthropic>=0.36,<1.0",
    "jsonschema>=4.23,<5.0",
    "python-multipart>=0.0.12,<1.0",
    "email-validator>=2.2,<3.0",
    "sentence-transformers>=3.1,<4.0",
    "torch>=2.4,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
index-strategy = "unsafe-best-match"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` / `File(...)` idiom relies on call-in-default-argument.
# UP042: `class X(str, Enum)` is kept intentionally for Pydantic v2 JSON (de)serialization.
ignore = ["E501", "B008", "UP042"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
